name: Project Iolite Integrity
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24' # Matching your mod file logic
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -race -v ./...
# [FORENSIC ANCHOR]: Mutative Fuzzing Phase
      - name: Fuzz Audit Parser
        run: go test -fuzz=FuzzAuditParser -fuzztime=10s ./brain/...

